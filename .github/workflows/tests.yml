name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js (dashboard app.js probe)
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Show tool versions
        run: |
          python --version
          node --version
          python -m pip show MaaFw

      - name: Run offline tests
        run: python -m pytest -p no:cacheprovider -o addopts= -q -ra
