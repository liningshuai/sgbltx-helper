[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sgbltx-helper"
version = "0.1.0"
description = "三国兵临天下 本地纯领取闭环（第一阶段）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "MaaFw==5.14.2",
    "numpy==2.5.3",
    "Pillow==11.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sgbltx_helper = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
